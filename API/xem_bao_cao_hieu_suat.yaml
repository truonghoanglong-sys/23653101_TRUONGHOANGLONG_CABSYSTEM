openapi: 3.0.3
info:
  title: API Xem báo cáo hiệu suất
  description: Theo dõi các báo cáo chỉ số KPI, tỷ lệ hoàn thành/hủy chuyến và hiệu suất hoạt động của tài xế.
  version: 1.0.0
paths:
  /executive/reports/performance/kpi:
    get:
      summary: Theo dõi các báo cáo chỉ số KPI
      responses:
        '200':
          description: Báo cáo chỉ số KPI hệ thống
  /executive/reports/performance/completion-rate:
    get:
      summary: Theo dõi tỷ lệ hoàn thành/hủy chuyến
      responses:
        '200':
          description: Báo cáo tỷ lệ hoàn thành và hủy chuyến
  /executive/reports/performance/driver-efficiency:
    get:
      summary: Theo dõi hiệu suất hoạt động của tài xế
      responses:
        '200':
          description: Báo cáo hiệu suất hoạt động của tài xế