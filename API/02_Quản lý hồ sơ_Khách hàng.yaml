  version: 1.0.0
  description: "API cho FR-CUS-02 - Quản lý hồ sơ, tác nhân: Khách hàng."
paths:
  '/api/customer/profile':
    put:
      summary: "Quản lý hồ sơ"
      operationId: fr_cus_02
      tags:
        - "Khách hàng"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
