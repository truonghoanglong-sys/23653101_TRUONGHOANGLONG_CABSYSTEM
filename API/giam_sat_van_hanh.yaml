openapi: 3.0.3
info:
  title: API Giám sát vận hành
  description: Theo dõi danh sách các chuyến đi đang diễn ra và vị trí/trạng thái của tài xế real-time trên bản đồ.
  version: 1.0.0
paths:
  /ops/trips/active:
    get:
      summary: Theo dõi danh sách các chuyến đi đang diễn ra
      responses:
        '200':
          description: Danh sách các chuyến đi đang diễn ra
  /ops/drivers/realtime-locations:
    get:
      summary: Theo dõi vị trí và trạng thái tài xế real-time trên bản đồ
      responses:
        '200':
          description: Dữ liệu vị trí và trạng thái real-time của các tài xế