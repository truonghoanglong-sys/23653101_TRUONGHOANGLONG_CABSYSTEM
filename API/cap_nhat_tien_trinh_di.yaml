openapi: 3.0.3
info:
  title: API Cập nhật tiến trình đi
  description: Cập nhật trạng thái thực tế của chuyến đi theo luồng Đã đến điểm đón -> Bắt đầu di chuyển -> Hoàn thành chuyến đi.
  version: 1.0.0
paths:
  /driver/trips/{trip_id}/status:
    put:
      summary: Cập nhật tiến trình thực tế của chuyến đi
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ARRIVED_AT_PICKUP, IN_PROGRESS, COMPLETED]
      responses:
        '200':
          description: Cập nhật tiến trình chuyến đi thành công