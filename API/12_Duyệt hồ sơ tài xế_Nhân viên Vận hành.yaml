openapi: 3.0.3
info:
  title: "Duyệt hồ sơ tài xế"
  version: 1.0.0
  description: "API cho FR-OPS-01 - Duyệt hồ sơ tài xế, tác nhân: Nhân viên Vận hành."
paths:
  '/api/ops/driver-profiles/{driverId}/approval':
    post:
      summary: "Duyệt hồ sơ tài xế"
      operationId: fr_ops_01
      tags:
        - "Nhân viên Vận hành"
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: "Thực hiện chức năng thành công."
        '400':
          description: "Dữ liệu yêu cầu không hợp lệ."
        '401':
          description: "Chưa xác thực hoặc không có quyền truy cập."
        '500':
          description: "Lỗi hệ thống."
