openapi: 3.0.3
info:
  title: API Duyệt hồ sơ tài xế
  description: Kiểm tra thông tin, hình ảnh giấy tờ do tài xế cung cấp để Phê duyệt hoặc Từ chối cấp quyền hoạt động.
  version: 1.0.0
paths:
  /ops/drivers/{driver_id}/documents:
    get:
      summary: Xem thông tin và hình ảnh giấy tờ tài xế
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết hồ sơ và giấy tờ tài xế
  /ops/drivers/{driver_id}/approval:
    post:
      summary: Phê duyệt hoặc Từ chối cấp quyền hoạt động cho tài xế
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
                reason:
                  type: string
      responses:
        '200':
          description: Xử lý duyệt hồ sơ tài xế thành công