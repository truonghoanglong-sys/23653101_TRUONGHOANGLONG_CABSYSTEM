openapi: 3.0.3
info:
  title: API Đánh giá dịch vụ
  description: Chấm điểm số sao (1–5 sao) và gửi nhận xét về chất lượng chuyến đi sau khi hoàn tất.
  version: 1.0.0
paths:
  /reviews:
    post:
      summary: Chấm điểm và gửi nhận xét chất lượng chuyến đi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                trip_id:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Đánh giá thành công