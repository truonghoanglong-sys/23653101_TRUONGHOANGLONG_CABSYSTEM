openapi: 3.0.3
info:
  title: "Hủy xe"
  version: 1.0.0
  description: "API cho FR-CUS-04 - Hủy xe, tác nhân: Khách hàng."
paths:
  '/api/customer/rides/{rideId}/cancel':
    post:
      summary: "Hủy xe"
      operationId: fr_cus_04
      tags:
        - "Khách hàng"
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: "Thực hiện chức năng thành công."
        '400':
          description: "Dữ liệu yêu cầu không hợp lệ."
        '401':
          description: "Chưa xác thực hoặc không có quyền truy cập."
        '500':
          description: "Lỗi hệ thống."
