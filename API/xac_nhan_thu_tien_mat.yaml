openapi: 3.0.3
info:
  title: API Xác nhận thu tiền mặt
  description: Xác nhận đã thu đủ số tiền mặt từ khách hàng đối với các chuyến đi thanh toán bằng tiền mặt.
  version: 1.0.0
paths:
  /driver/trips/{trip_id}/confirm-cash:
    post:
      summary: Xác nhận đã thu đủ tiền mặt từ khách hàng
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_collected:
                  type: number
      responses:
        '200':
          description: Xác nhận thu tiền mặt thành công