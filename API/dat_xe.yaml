openapi: 3.0.3
info:
  title: API Đặt xe
  description: Nhập điểm đi, điểm đến, chọn loại xe, xem cước phí dự kiến và gửi yêu cầu tìm tài xế.
  version: 1.0.0
paths:
  /bookings/estimate-fare:
    post:
      summary: Xem cước phí dự kiến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location:
                  type: string
                destination_location:
                  type: string
                vehicle_type:
                  type: string
      responses:
        '200':
          description: Trả về cước phí dự kiến và quãng đường
  /bookings/request:
    post:
      summary: Gửi yêu cầu tìm tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_location:
                  type: string
                destination_location:
                  type: string
                vehicle_type:
                  type: string
                estimated_fare:
                  type: number
      responses:
        '201':
          description: Yêu cầu đặt xe đã được gửi thành công