openapi: 3.0.3
info:
  title: API Quản lý dữ liệu
  description: Quản trị danh mục, phân quyền truy cập người dùng (RBAC) và quản lý cơ sở dữ liệu.
  version: 1.0.0
paths:
  /admin/data/categories:
    get:
      summary: Quản trị danh mục hệ thống
      responses:
        '200':
          description: Danh sách các danh mục hệ thống
  /admin/security/rbac/permissions:
    post:
      summary: Phân quyền truy cập người dùng (RBAC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Phân quyền người dùng thành công
  /admin/data/database:
    get:
      summary: Quản lý cơ sở dữ liệu
      responses:
        '200':
          description: Thông tin trạng thái cơ sở dữ liệu