openapi: 3.0.3
info:
  title: API Tra cứu giao dịch
  description: Khai thác và kiểm tra chi tiết thông tin lịch sử các giao dịch thanh toán trên hệ thống.
  version: 1.0.0
paths:
  /finance/transactions:
    get:
      summary: Khai thác lịch sử các giao dịch thanh toán
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
        - name: end_date
          in: query
          schema:
            type: string
        - name: payment_method
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách lịch sử giao dịch thanh toán
  /finance/transactions/{transaction_id}:
    get:
      summary: Kiểm tra chi tiết thông tin giao dịch thanh toán
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết giao dịch thanh toán