openapi: 3.0.3
info:
  title: API Cập nhật trạng thái sẵn sàng
  description: Chủ động bật/tắt chế độ nhận chuyến (Sẵn sàng / Ngừng nhận chuyến).
  version: 1.0.0
paths:
  /driver/status:
    put:
      summary: Cập nhật trạng thái nhận chuyến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: true - Sẵn sàng, false - Ngừng nhận chuyến
      responses:
        '200':
          description: Trạng thái đã được cập nhật thành công