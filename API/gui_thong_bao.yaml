openapi: 3.0.3
info:
  title: API Gửi thông báo
  description: Chịu trách nhiệm truyền tải các Push Notification, SMS, Email tức thì đến thiết bị của người dùng.
  version: 1.0.0
paths:
  /notifications/send:
    post:
      summary: Truyền tải các Push Notification, SMS, Email tức thì đến thiết bị của người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_id:
                  type: string
                channel:
                  type: string
                  enum: [PUSH, SMS, EMAIL]
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Gửi thông báo thành công